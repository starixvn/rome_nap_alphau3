<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
    <title>{static:Resources.Lang.handhistorydetail}</title>
    <link href="../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="Resources/BetList.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <table id="casino-betlist-a" style="width: 100%;">
        <!--tableName-->
        <thead>
            <tr>
                <th colspan="6" class="hd2 b">
                    <span>{tablename} - {datetime}</span>
                </th>
            </tr>
        </thead>
        <!--/tableName-->
        <!--userName-->
        <tr class="th b">
            <td colspan="6" align="center">
                {Player}: {UserName}
            </td>
        </tr>
        <!--/userName-->
        <!--resultHeader-->
        <tr class="th b">
            <td class="c" colspan="6" align="center">
                {Result}
            </td>
        </tr>
        <!--/resultHeader-->
        <!--resultValue-->
        <tr class="bg_eb">
            <td colspan="6" align="center" style="padding: 3px 3px 3px 3px">
                {result_vl}
            </td>
        </tr>
        <!--/resultValue-->
        <!--history-->
        <tr>
            <td class="b c">
                {historyNo}
            </td>
            <td class="l" colspan="5">
                {historyNo_vl}
            </td>
        </tr>
        <!--/history-->
        <!--autoPlay-->
        <tr>
            <td class="b c">
                {autoPlay}
            </td>
            <td class="l" colspan="5">
                {autoPlay_vl}
            </td>
        </tr>
        <!--/autoSpin-->
        <!--total-->
        <tr class="hd2 b">
            <td class="l">
                {bet}
            </td>
            <td class="r" colspan="5">
                {bet_vl}
            </td>
        </tr>
        <tr class="hd2 b">
            <td class="l">
                {odds}
            </td>
            <td class="r" colspan="5">
                {odds_vl}
            </td>
        </tr>
        <tr class="hd2 b">
            <td class="l">
                {winloss}
            </td>
            <td class="r" colspan="5">
                {winloss_vl}
            </td>
        </tr>
        <!--/total-->
    </table>
</body>
</html>
