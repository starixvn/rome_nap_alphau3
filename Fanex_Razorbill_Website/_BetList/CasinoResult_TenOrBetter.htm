<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.handhistorydetail}</title>
    <link href="Resources/BetList.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <center>
        <table id="casino-betlist-a">
        <!--Content-->
            <thead>
                <tr>
                    <th colspan="2" class="c">
                        {tableName} {static:Resources.Casino.at} {betTime}
                    </th>
                </tr>
            </thead>
            <tr>
                <td colspan="2" class="c b">
                    {static:Resources.Casino.Player}: {userName}
                </td>
            </tr>
            <!--Result-->
            <tr>
                <td colspan="2" class="c">
                    {result}
                </td>                
            </tr>
            <!--/Result-->
            <tr class="hd">
                <td class="c">
                    {playerHistoryNo}
                </td>
                <td class="l">
                    {playerHistoryNoResult}
                </td>
            </tr>
            <tr>
                <td class="l b">
                    {ConSize}
                </td>
                <td class="r b">
                    {ConSize_vl}
                </td>
            </tr>
            <tr>
                <td class="l b">
                    {Bet}
                </td>
                <td class="r b">
                    {Bet_vl}
                </td>
            </tr>
            <tr>
                <td class="l b">
                    {WinLoss} 
                </td>
                <td class="r b">
                   {WinLoss_vl}
                </td>
            </tr>
            <!--/Content-->
            <!--NoInfo-->
            <tr class="no_info">
                <td colspan="2" class="c">
                    {static:Resources.Lang.noInfo}
                 </td>
            </tr>
            <!--/NoInfo-->
        </table>
    </center>
</body>

</html>
