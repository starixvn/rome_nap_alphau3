<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.handhistorydetail}</title>
    <link href="Resources/BetList.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <table id="casino-betlist-a" style="width: 100%">
    <!--Content-->
        <thead>
            <tr>
                <th colspan="2" class="c">
                    {tableName} {static:Resources.Casino.at} {betTime}
                </th>
            </tr>
        </thead>
        <tr>
            <td colspan="2" class="c b">
                {static:Resources.Casino.Player}: {userName}
            </td>
        </tr>
        <tr class="th b">
            <td colspan="2" class="c">
                {ResultName}
            </td>
        </tr>
        <tr>
            <td colspan="2" class="c">
                {result}
            </td>
        </tr>
        <tr class="hd">
            <td class="c">
                {playerHistoryNo}
            </td>
            <td class="l">
                {playerHistoryNoResult}
            </td>
        </tr>
        <tr class="hd">
            <td class="c">
                {AutoPlay}
            </td>
            <td class="l">
                {AutoPlayResult}
            </td>
        </tr>
        <tr>
            <td class="l">
                {Bet}
            </td>
            <td class="r">
                {BetMoney}
            </td>
        </tr>
        <tr>
            <td class="l">
                {Odds}
            </td>
            <td class="r">
                {OddsValue}
            </td>
        </tr>
        <tr class="hd">
            <td class="l">
                {static:Resources.Casino.Win}
            </td>
            <td class="r">
                {Win}
            </td>
        </tr>
        <!--/Content-->
        <!--NoInfo-->
        <tr class="no_info">
            <td colspan="2" class="c">
                {static:Resources.Lang.noInfo}
            </td>
        </tr>
        <!--/NoInfo-->
    </table>
</body>
</html>
