<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
    <head>
        <title>{static:Resources.Lang.handhistorydetail}</title>
        <link href="../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
        <link href="Resources/BetList.css" rel="stylesheet" type="text/css" />    
    </head>
    <body>
        <table id="casino-betlist-a" style="width: 100%;">
            <thead>
            <tr>
                <th colspan="2" class="hd2 b">
                    <span>{tablename} - {datetime}</span>
                </th>
            </tr>
            </thead>
            <tr class="th b">
                <td colspan="2" align="center">
                    {Player}: {UserName}
                </td>
            </tr>
            <tr class="hd2 b">
                <td class="c" colspan="2">
                    {Result}
                </td>        
            </tr>
            <tr class="c">
                <td class="c" colspan="2">
                    <center>
                        <table class="c" id="casino-betlist-a2">
                            <tr>
                                <td>
                                    {Val1}</td>
                                <td>
                                    {Val2}</td>
                                <td>
                                    {Val3}</td>
                            </tr>
                            <tr>
                                <td>
                                    {Val4}</td>
                                <td>
                                    {Val5}</td>
                                <td>
                                    {Val6}</td>
                            </tr>
                            <tr>
                                <td>
                                    {Val7}</td>
                                <td>
                                    {Val8}</td>
                                <td>
                                    {Val9}</td>
                            </tr>
                        </table>
                    </center>
                </td>
            </tr>
            <tr class="th">
                <td class="b c">
                    {PlayerHistoryNo}</td>
                <td class="l">
                    {PlayerHistoryNo_vl}</td>
            </tr>
            <tr class="th">
                <td class="b c">
                    {AutoPlay}</td>
                <td class="l">
                    {AutoPlay_vl}</td>
            </tr>
            <tr class="th b">
                <td class="l">
                    {bet}
                </td>
                <td class="r">
                    {bet_vl}
                </td>
            </tr>            
            <tr class="th">
                <td class="b l">
                    {Odds}</td>
                <td class="b r">
                    {Odds_vl}</td>
            </tr>
            <!--MultiplierBlog-->
            <tr class="th b">
                <td class="l">
                    {Multiplier}</td>
                <td class="r">
                    {Multiplier_vl}</td>
            </tr>
            <!--/MultiplierBlog-->
            <tr class="th b">
                <td class="l">
                    {winloss}
                </td>
                <td class="r">
                    {winloss_vl}
                </td>
            </tr>
        </table>        
    </body>
</html>
