<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="width=device-width, minimum-scale=0.6, maximum-scale=0.6" />
    <title>Sign In</title>
    <link href="Resources/SignIn.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <center>
        <div id="cpanel">
            <form method="post" name="fLogin">
            <div id="errmsg" class="errmsg" style="text-align: center; margin-left: 122px; margin-right:15px;"></div>
            <table align="center" class="tblMain" border="0" cellpadding="0" cellspacing="0">
                <tr>
                    <td class="tdBlank">
                    </td>
                    <td class="tdLangSpan">
                        <span id="spnLanguage" class="language"></span>
                    </td>
                    <td class="tdLangOpt">
                        <select id="selLanguage" onchange="SelectLanguage(this.value)" style="height: 20px; width: 85px;">
                            <option value="0">English</option>
                            <option value="1">繁體中文</option>
                            <option value="4">简体中文</option>
                            <option value="2">日本語</option>
                            <option value="3">ภาษาไทย</option>
                            <option value="5">한국어</option>
                            <option value="6">Tiếng Việt</option>
                        </select>
                        <input type="hidden" value="en-US" id="hidLanguage" name="hidLanguage" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <span id="spnUserName" style="font-weight: bold;">Username</span>
                    </td>
                    <td colspan="2">
                        <input class="tb" id="txtUserName" name="txtUserName" type="text" value="{username_value}" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <span id="spnPassWord" style="font-weight: bold;">Password</span>
                    </td>
                    <td colspan="2">
                        <input class="tb" id="txtPassWord" name="txtPassWord" type="password" />
                    </td>
                </tr>
                <tr>
                    <td onclick="GetValidateImage()">
                        <img src='Handlers/Captcha.ashx' id="imgCode" alt="" />
                    </td>
                    <td colspan="2">
                        <input class="tb" value="{captcha_value}" id="txtCaptcha" name="txtCaptcha" type="text" maxlength="4" autocomplete="off" onkeydown="age.DoEnter(event, 'DoLogin()')" />
                    </td>
                </tr>
                <tr>
                    <td>
                    </td>
                    <td colspan="2">
                        <input id="btnLogin" type="button" class="buttonsite" value="Login" onclick="return DoLogin()" />
                    </td>
                </tr>
            </table>
            <div id="divBrowser" class="text_browser">Recommended Browsers</div>
            <div style="padding-top:23px">{VersionMobile}</div>
            </form>
        </div>
    </center>
</body>
<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script src="Resources/SignIn.js" type="text/javascript"></script>
</html>
