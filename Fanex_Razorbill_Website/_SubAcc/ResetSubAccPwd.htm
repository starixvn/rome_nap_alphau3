<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.lblChangePassword}</title>
    <link href="../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../_GlobalResources/Css/Popup.css" rel="stylesheet" type="text/css" />
</head>
<body>

<div class="page_popup">

{static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}

<table align="left" width="100%" class="tblPop" cellspacing="1" cellpadding="0" border="0" onkeydown="age.DoEnter(event, 'UpdateResetSubAccPwd()')">
    <tr class="bg_eb2">
        <td class="r b" width="40%">{static:Resources.Lang.password}</td>
        <td class="l">
            <input id="txtNewPwd" onkeyup="return CheckPass(this,'spnNewPwdIcon');" type="password" name="txtNewPwd" />
            <span id="spnNewPwdIcon">&nbsp;</span>
            <span id="spnInfoIco" class="infoIco" title="{static:Resources.Lang.lblPasswordRequire}" style="left: 296px;line-height: 19px;position: absolute;z-index: 999;">&nbsp;</span>
        </td>
    </tr>
    <tr class="bg_eb2">
        <td class="r b">{static:Resources.Lang.lblConfirmPassword}</td>
        <td class="l">
            <input id="txtConfirmPwd" onkeyup="return CheckPass(this,'spnConfirmPwdIcon');" type="password" name="txtConfirmPwd" />
            <span id="spnConfirmPwdIcon">&nbsp;</span>
        </td>
    </tr>
    <tr class="bg_eb2">
        <td class="c" colspan="2">
            <input type="button" id="btnEdit" onclick="UpdateResetSubAccPwd()" name="btnEdit" value=" {static:Resources.Lang.update} " class="btn" />
        </td>
    </tr>
</table>

</div>

</body>
<script src="../_GlobalResources/Js/Core.js" type="text/javascript"></script>

<script src="Resources/SubAcc.js" type="text/javascript"></script>
</html>
