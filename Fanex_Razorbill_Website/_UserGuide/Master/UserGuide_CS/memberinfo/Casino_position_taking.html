<h2 class="h2">娱乐城占成数</h2>
<p><span class="rpt-head1">定义:</span></p>
    显示总代理创建代理时取得的总代理原始娱乐城占成数, 和代理从会员处可得到的最高占城数。<br>
<p><center>
<img src="images/CasinoPositionTaking/Agent.jpg"/><br />
<em>图 1.1</em>
</center>
<p>如果您要查看总代理/代理从每个会员处取得的实际占成数基于个别游戏类型, 点击代理用户名 (图1.2)。</p>
<center>
<img src="images/CasinoPositionTaking/Member.jpg"/><br />
<em>图 1.2</em>
</center>
<p><span class="rpt-head1">如何编辑占成数:</span></p>
点击会员用户名以修改占成数。
<p><center>
<img src="images/CasinoPositionTaking/UpdateCasinoSetting.jpg"/><br />
<em>图 1.3</em>
</center><p>
<ul>
<strong>注: </strong><br>
<ul>
<li>总代理占成 + 代理占成 <= 上线设定的代总理最高占成。</li>
<li>总代理占成 + 代理占成 >= 上线设定的总代理最低占成。</li>
</ul></ul>
