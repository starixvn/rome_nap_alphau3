<h2 class="h2">客户信息</h2>
<p><span class="rpt-head1">定义:</span></p>
此功能允许总代理搜索及查看代理, 会员的详细资料包括会员名单, 账目及日志。要查看您的下线资料, 键入用户名。<br />
<strong>注:</strong> 
<ul>
<li>会员可通过用户名, 名字或信姓氏进行搜索。只要输入两个字符, 大部分搜索客户将被列出。</li>
<li>要查看该客户的所有日志, 点击用户名, 请查阅<a href="../viewlog/view_log.html">察看日志</a>指引以了解这一页的详情。</li>
<li>要查看下线名单, 点击会员。</li>
<li>要查看账目, 点击账目。</li>
<li>会员, 账目将根据文本框中被搜索的客户显示。</li>
</ul>
