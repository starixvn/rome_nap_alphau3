<h2 class="h2">客戶信息</h2>
<p><span class="rpt-head1">定義:</span></p>
此功能允許總代理搜索及查看代理, 會員的詳細資料包括會員名單, 賬目及日誌。要查看您的下線資料, 鍵入用戶名。<br />
<strong>注:</strong> 
<ul>
<li>會員可通過用戶名, 名字或姓氏進行搜索。只要輸入兩個字符, 大部分搜索客戶將被列出。</li>
<li>要查看該客戶的所有日誌, 點擊用戶名, 請查閱<a href="../viewlog/view_log.html">察看日誌</a>指引以了解這一頁的詳情。</li>
<li>要查看下線名單, 點擊會員。</li>
<li>要查看賬目, 點擊賬目。</li>
<li>會員, 賬目將根據文本框中被搜索的客戶顯示。</li>
</ul>
