<h2 class="h2">娛樂城佔成數</h2>
<p><span class="rpt-head1">定義:</span></p>
    顯示總代理創建代理時取得的總代理娛樂城原始佔成數, 和代理從會員處可得到的最高占城數。<br>
<p><center>
<img src="images/CasinoPositionTaking/Agent.jpg"/><br />
<em>圖 1.1</em>
</center>
<p>如果您要查看總代理/代理從每個會員處取得的實際佔成數基於個別遊戲類型, 點擊代理用戶名 (圖1.2)。</p>
<center>
<img src="images/CasinoPositionTaking/Member.jpg"/><br />
<em>圖 1.2</em>
</center>
<p><span class="rpt-head1">如何編輯佔成數:</span></p>
點擊會員用戶名以修改佔成數。
<p><center>
<img src="images/CasinoPositionTaking/UpdateCasinoSetting.jpg"/><br />
<em>圖 1.3</em>
</center><p>
<ul>
<strong>注: </strong><br>
<ul>
<li>總代理佔成 + 代理佔成 <= 上線設定的代總理最高佔成。<br></li>
<li>總代理佔成 + 代理佔成 >= 上線設定的總代理最低佔成。<br></li>
</ul></ul>
