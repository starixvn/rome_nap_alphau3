<h2 class="h2">佔成數%</h2>
<p><span class="rpt-head1">定義:</span></p>
代理佔成為份額百分比決定代理在每張註單的輸贏數額<br>
<p><center>
<img src="images/PTList.png"/><br />
<em>佔成數</em>
</center><p>
<p><span class="rpt-head1">如何編輯佔成數:</span></p>
點擊會員用戶名已修改佔成數<p><center>
<img src="images/editSB_single.png" /><br />
<em>編輯佔成數</em>
</center><p>
<ul>
<strong>注： </strong><br>
<ul>
<li>代理佔成 <= 上線設定的代理最高佔成<br></li>
<li>代理佔成 >= 上線設定的代理最低佔成<br></li>
<li>代理可以為個別運動類型進行個別投注類型的設定或使用複制功能<br></li>
<li>從亞洲盤複製適用於大小盤, 上半場亞洲盤, 上半場大小盤, 單雙投注類別<br></li>
<li>從1X2複製適用於波膽, 總進球, 混合過關, 優勝冠軍投注類別<br></li>
<li>滾球投注, 從亞洲盤複製適用於大小盤, 上半場亞洲盤,上半場大小盤投注類別</li>
</ul></ul>
