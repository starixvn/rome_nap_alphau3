<h2 class="h2">亚洲盘/大小盘/滚球</h2>
<p>查看代理人'赢/输数字根据亚洲盘/大小盘/滚球投注种类。<p><center>
<img src="images/h1_CS.jpg" /><br />
<em>亚洲盘/大小盘/滚球</em>
</center><p>
<ul>
  <li>在这个例子中，会员投注 埃弗顿 -vs-
      利物浦,</li>
  金额 = <strong class="style1">100</strong>, 赔率=<strong class="style1"> 0.6</strong>,&nbsp; 代理占成 =<strong class="style1"> 50%</strong>, 投注种类=亚洲盘，会员选择: 埃弗顿 0.5<br />
<ul>
<li>如果(主得分 - 客得分) >= 0 然后会员将赢<br> --> 代理将输: 100* 0.6*50% = <span 
        class="style2"> <b>30</b></span><br></li>
<li>如果(主得分- 客得分) < 0 然后会员将输<br> --> 代理将赢: 100*50% = <b>50</b><br></li>
</ul>
