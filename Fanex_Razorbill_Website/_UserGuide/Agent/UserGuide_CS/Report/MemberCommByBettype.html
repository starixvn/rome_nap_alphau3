<p><span class="rpt-head1">定义:</span> </p>
<p>这是为了告诉代理他在扣除会员佣金后可得到的佣金。这份报告根据每个会员对每个投注类别进行分类 (图 6.1)。</p>

<span class="rpt-head1">如何理解报告:</span>
<p>
    从上图6.1, 我们可以看到代理扣除会员佣金后总输额为 1.47 及以下为更详细的资料。</p>
<ul>
  <li>投注类别 让球: 代理必须自行支付 <b>1.2</b> 会员佣金.</li>
  <li>投注类别 大小盘: 代理必须自行支付 <b>0.27</b> 会员佣金.</li>
</ul>
