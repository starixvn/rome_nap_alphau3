<h2 class="h2">已删除/作废注单</h2>
<p><span class="rpt-head1">定义:</span> </p>
<p>这份报告有助于代理保持追踪近三日内被系统作废或删除的投注 (图7.1).</p>

  <center>
  <img src="images/CancelledBets/MemberCancelledBets.jpg" alt="Member Cancelled Bets" />
  <br />
   <em>图 7.1</em>
</center>
  <p>
  这份报告将每位会员被删除或作废的投注进行分类, 只需在列表中点选会员那么页面将显示会员所有删除/作废的注单。</p>
  <p><ul>
    <li>作废: 接受了的投注但最后被管理员删除。</li>
    <li>取消: 会员的注单在投注时即被操作员取消。</li>
    </ul>
  </p>
