<p><span class="rpt-head1">定义:</span> </p>
<p>这是一个简短的报告, 总计每天的输赢, 佣金, 转账数额及帮助代理保持追踪他/她的每日收入。</p>

<p>从图8.1, 代理可以得到他/她的总结报告, 例如在09/23/2008代理基于占成数的输额为17.7及支付会员佣金后得到的佣金为-0.18.</p>

  <p>备注: 显示相关日期的活动.</p>
