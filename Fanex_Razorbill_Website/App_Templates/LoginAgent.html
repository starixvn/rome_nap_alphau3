<div class="login_background">	
<form id="frmlogin" name="frmlogin" method="post">
	<div id="lg1"></div>
	<div id="lg2">
		<table width="35%" border="0" align="center" cellpadding="0" cellspacing="0" style="margin-top:20px;" >
			<tr height="26">
				<td class="lang1" onclick="Language(2);">&nbsp;</td>
				<td class="lang3" onclick="Language(3);">&nbsp;</td>
				<td class="lang4" onclick="Language(1);">&nbsp;</td>
				<td class="lang2" onclick="Language(4);">&nbsp;</td>
			</tr>
		</table>
	</div>
<div id="lg_main">
    <table class="table_main"  border="0" align="center" cellpadding="0" cellspacing="0">
	    <tr>
		    <td colspan="2" style="text-align:center;">
			    <div class="login_header_en" id="header_login"></div>
		    </td>
	    </tr>
	    <tr>
		    <td colspan="2" style="text-align:center;">
			    <div id="alerterror" class="errormsg errorheight"></div>					
		    </td>
	    </tr>           
	    <tr>
		    <td class="text_login" id="username">User Name:</td>
		    <td class="l">
			    <input class="input_login" name="txtusername" type="text" id="txtusername" size="35" onkeyup="PreLogin(event);"/>
		    </td>
	    </tr>
	    <tr>
		    <td class="text_login" id="password">Password:</td>
		    <td class="l">
			    <input class="input_login" name="txtpassword" type="password" id="txtpassword" size="35" onkeyup="PreLogin(event);"/>
		    </td>
	    </tr>
	    <tr>
		    <td colspan="2" class="c">					
			    <span class="btn_login">
				    <a href="javascript:void();" Onclick="ExcLogin();" id="login">Login</a>	 
			    </span>					
			    <!--<input type="button" value="Login" class="btn_login" />-->
		    </td>
        </tr>
    </table>
</div>
<div id="lg3"></div>
<input type="hidden" id="hLang" name="hLang" value="{lang}" />	
</form>
</div>
