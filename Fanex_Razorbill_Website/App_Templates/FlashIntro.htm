<div id="{flashname}" style="display:none; width:{flashwidth}px; height:{flashheight}px;">    
    <div style="position:absolute; right:1px; top:1px;" onclick="this.parentNode.style.display='none';">    
        <img style="cursor:pointer;" src="../App_Themes/AgencyV2/Images/x.jpg" alt="close" title="Close" />
    </div>
    <center>
    <object classid="clsid:D27CDB6E-AE6D-11cf-96B8-444553540000" codebase="https://download.macromedia.com/pub/shockwave/cabs/flash/swflash.cab#version=7,0,19,0" width="{flashwidth}" height="{flashheight}" title="Welcome" ID="Object1"/>
        <param name="movie" value="../Flash/{flashnamepath}_{langcode}.swf"/>
        <param name="quality" value="high"/>
        <param name="wmode" value="transparent"/>
        <embed src="../Flash/{flashnamepath}_{langcode}.swf" quality="high" pluginspage="https://www.macromedia.com/go/getflashplayer" type="application/x-shockwave-flash" width="{flashwidth}" height="{flashheight}" wmode="transparent"></embed>
    </object>
    </center>    
    <div style="position:absolute; bottom:3px; right:5px; font-size:9px; color:#7D2D2E;"><input type="checkbox" onclick="javascript:setFlashCookie(this.parentNode.parentNode.id, this.checked, {userid}, {subid});" />{lbldonotshowagain}</div>
</div>
