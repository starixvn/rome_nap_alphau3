<script type="text/javascript">
	function reset_date(){
	var dayNoReset={DayNoReset};
	var fdateId='{Fdate}';
	var tdateId='{Tdate}';
	var td = new Date();
	var fd=new Date(td.getTime()-dayNoReset*24*60*60*1000);
	$(fdateId).value=(fd.getMonth()+1)+"/"+fd.getDate()+"/"+fd.getFullYear();
	$(tdateId).value=(td.getMonth()+1)+"/"+td.getDate()+"/"+td.getFullYear();
	}
</script>
