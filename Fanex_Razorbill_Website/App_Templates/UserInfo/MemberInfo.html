<link href='../../App_Themes/AgencyV2/userinfo.css' type='text/css' rel='stylesheet' />

<div id="page_popup">    
<div id="header_popup">{lbleditinfo}</div>
<form name="fUpdateInfo" style="float:left;" id="fUpdateInfo" action="{updateinfohandler}"  target="frUpdate" method="post">
<div style="width:550px;">{error-message}</div>
<table border="0" cellpadding="0" cellspacing="1" width="550px" class="tblRpt">
<tbody>        
    <tr class="RptHeader">
        <td colspan="4" align="center">        
        {lbleditcustinfo}
        </td>
    </tr>
    <tr class="bg_eb2">
        <td class="r" width="25%">
            {fname-text}
        </td>
        <td class="l" width="25%">
            <input type="text" style="width: 127px" maxlength="32" id="txtFName" name="txtFName" value="{fname-val}" />
        </td>
        <td class="r" width="25%">
            {lname-text}
        </td>
        <td class="l" width="25%">
            <input type="text" style="width: 127px" maxlength="32" id="txtLName" name="txtLName" value="{lname-val}" />
        </td>
    </tr>
    <tr class="bg_eb2">
        <td class="r">
            {phone-text}
        </td>
        <td class="l">
            <input type="text" style="width: 127px" maxlength="32" id="txtPhone" name="txtPhone" value="{phone-val}" />
        </td>
        <td class="r">
            {mobile-text}
        </td>
        <td class="l">
            <input type="text" style="width: 127px" maxlength="32" id="txtMobile" name="txtMobile" value="{mobile-val}" />
        </td>
    </tr>
    <tr class="bg_eb2">
        <td class="r">
            {email-text}
        </td>
        <td class="l">
            <input type="text" style="width: 127px" maxlength="32" id="txtEmail" name="txtEmail" value="{email-val}" />
        </td>
        <td class="r">
            {fax-text}
        </td>
        <td class="l">
            <input type="text" style="width: 127px" maxlength="32" id="txtFax" name="txtFax" value="{fax-val}" />
        </td>
    </tr>
    <tr>
    <td colspan="4" align="center" class="bg_eb">        
        <input AccountPermisssion="[B]" type="submit" id="btnSubmit" value="{update}" onclick="return checkAndSubmitCustInfo();" class="btn" />
       &nbsp;
        <input AccountPermisssion="[B]" type="reset" id="btnReset" value="{reset}" onclick="$('diverrmsg').style.display='none'; $('txtFName').focus();" class="btn" />
       &nbsp; 
    </td>
    </tr>
</tbody>
</table> 
</form>

<iframe name="frUpdate" frameborder="0" class="hidden" height="0px" width="0px">
</iframe>

</div>
