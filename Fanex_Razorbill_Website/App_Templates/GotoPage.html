<div id="page_menu" class="vbmenu_popup" style="display: none; border: solid 1px #aaa;width:140px; background-color: #eee">
    <table cellspacing="2" cellpadding="2" border="0" style="width: 100%; height: 30px;">
        <tr style="vertical-align: middle;">
            <td style="white-space: nowrap;">
                {textgotopage}:
            </td>
            <td>
                <input type="text" size="4" maxlength="6" onkeypress="return KeyPress(event);" style="font-size: 11px; width:23px; "
                    id="txtpage" name="txtpage" class="bginput" />
            </td>
            <td style="padding-bottom: 2px;">
                <input type="button" onclick="return GotoPageNext('{Url}','{Site}');" value="{textgo}"
                    id="pagenav_ibtn" class="btn" />
            </td>
        </tr>
    </table>
</div>
