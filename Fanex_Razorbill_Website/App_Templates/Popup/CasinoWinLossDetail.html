
<table class="tblPop c" cellpadding="0" cellspacing="1" border="0" align="left" style="width: 500px;">
    <!--content-->
    <tr class="b_mix_headPopup c">
        <th colspan="3" class="bl_evt c">
            <span class="bl_lname">{tablename} - {datetime}</span>
        </th>
    </tr>
    <tr class="bg_eb">
        <td colspan="3" align="center">
            {Player}: {UserName}
        </td>
    </tr>
    <tr class="b_mix_headPopup">
        <td colspan="3" align="center">
            {Result}
        </td>
    </tr>
    <!--row-->
    <tr class="bg_eb2">
        <td>
            {action}
        </td>
        <td colspan="2">
            {vl}
        </td>
    </tr>
    <!--/row-->
    <tr class="b_mix_headPopup">
        <td>
            {type}
        </td>
        <td>
            {bet}
        </td>
        <td>
            {win}
        </td>
    </tr>
    <!--row2-->
    <tr class="bg_eb2">
        <td class="c">
            {bettype}
        </td>
        <td class="r">
            {betvl}
        </td>
        <td class="r">
            {winvl}
        </td>
    </tr>
    <!--/row2-->
    <!--rowTotal-->
    <tr class="bg_eb b">
        <td class="c">
            {total}
        </td>
        <td class="r">
            {totalbet}
        </td>
        <td class="r">
            {totalwin}
        </td>
    </tr>
    <!--/rowTotal-->
    <!--/content-->
</table>
