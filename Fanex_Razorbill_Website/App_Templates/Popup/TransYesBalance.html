<!--nobackground-->
<link href='../../App_Themes/AgencyV2/userinfo.css' type='text/css' rel='stylesheet' />
<!--/nobackground-->
<div id="page_popup">
    <table width="380px" align="{tablealign}" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td>
            </td>
        </tr>
        <tr>
            <td class="l">
                <div id="header_popup">
                    {transfer}</div>
                {error-message}
            </td>
        </tr>
        <tr>
            <td>
                <table width="100%" cellpadding="0" cellspacing="1" border="0" class="tblPop c">
                    <tr class="bg_eb2">
                        <td class="r" style="width: 30%;">
                            {amount}
                        </td>
                        <td class="l b">
                            <input style="padding-left: 5px; text-align: right; width: 130px" type="text" id="txtamount" maxlength="17" name="txtamount" value="{amtvalue}" onkeypress="return OnkeyUpAmt(event);" />
                        </td>
                    </tr>
                    <tr class="bg_eb2">
                        <td>
                        </td>
                        <td align="left">
                            <input type="button" value="{submit}" onclick="UpdCreditYes();" class="btn" />&nbsp;
                            <!--cancelbtn-->
                            <input type="button" value="{cancel}" onclick="parent.ageWnd.close();" class="btn" /><!--/cancelbtn-->
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    <input id="custid" name="custid" value="{custid}" type="hidden" />
    <input id="usn" name="usn" value="{usn_value}" type="hidden" />
    <input id="isclose" name="isclose" value="{isclose_value}" type="hidden" />
    <input id="amount" name="amount" value="{amtvalue}" type="hidden" />
    <!--nobackground-->
    <input id="nobackground" name="nobackground" value="1" type="hidden" /><!--/nobackground-->
</div>
