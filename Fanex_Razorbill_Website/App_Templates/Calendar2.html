<!--calendar-include-->
<script src="../../Js/Calendar2/calendar.js" type="text/javascript"></script>
<script src="../../Js/Calendar2/date.js" type="text/javascript"></script>
<script src="../../Js/Calendar2/Lang/calendar-{Lang}.js" type="text/javascript"></script>
<script src="../../Js/Calendar2/calendar-setup.js" type="text/javascript"></script>
<link href="../../Js/Calendar2/Skin/calendar-blue.css" media="all" rel="stylesheet" type="text/css" title="Blue" />
<!--/calendar-include-->
<table cellpading="0" cellspacing="0" border="0">
    <tr>
        <td>
            <input id="{txtDate}" class="{TxtDateCls}" value="{currentDate}" {disabled} type="text" size="13" name="{txtDate}" readonly="readonly" />
        </td>
        <td>
        <!--limit-calendar-->
        <a href="#" class="imaLink">
            <img alt="" id="{triggerId}" {disabled} title="Date selector" style="margin: 0px; cursor:pointer;" src="../../App_Themes/AgencyV2/Images/cal.gif" />
        </a>
        <!--/limit-calendar-->       
        </td>
    </tr>
</table>

<script type="text/javascript">
   var intAllowMonth = "{AllowMonth}";
   var ctrInput = "{currentServerDate}";
  
   Calendar.setup({
    inputField : "{txtDate}", 
    ifFormat : "%m/%d/%Y", 
    showsTime : {ShowTime}, 
    button : "{triggerId}", 
    singleClick : {IsSingleClick},
    showOthers : {ShowOthers},
    step : 1
    });
</script>
