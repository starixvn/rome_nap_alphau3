<div id="page_main">
<div id="header_main">{lblChangePassword}</div>

<form style="position:absolute;">

<table id="trMsg" style="display:{TrMsgDisplay}" width="370" class="">
<tr><td>
    <!--Message-Error-->
        <table id="tbl1" align="left" cellspacing="0" cellpadding="0" border="0" style="display: {ErrDisplay}">
            <tr class="">
                <td class="l" style="width: 380px">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" id="diverrmsg">
                        <tr>
                            <td id="1_1" class="emsg_1_1">&nbsp;</td>
                            <td id="1_2" class="emsg_1_2">&nbsp;</td>
                            <td id="1_3" class="emsg_1_3">&nbsp;</td>
                        </tr>
                        <tr>
                            <td id="2_1" valign="top" class="emsg_2_1">&nbsp;</td>
                            <td valign="top" style="padding-left:30px;" id="spmsgerr" class="msgerr">{Message-Error}</td>
                            <td id="2_2" class="emsg_2_2">&nbsp;</td>
                        </tr>
                        <tr>
                            <td id="3_1" class="emsg_3_1">&nbsp;</td>
                            <td id="3_2" class="emsg_3_2">&nbsp;</td>
                            <td id="3_3" class="emsg_3_3">&nbsp;</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
        <!--/Message-Error-->
        <!--Message-->
        <table id="tbl2" align="left" cellspacing="0" cellpadding="0" border="0" style="display: {MsgDisplay}"> 
            <tr class="">
                <td class="l" style="width: 380px">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" id="Table1">
                        <tr>
                            <td class="emsg_1_1">&nbsp;</td>
                            <td class="emsg_1_2">&nbsp;</td>
                            <td class="emsg_1_3">&nbsp;</td>
                        </tr>
                        <tr>
                            <td valign="top" class="emsg_2_1">&nbsp;</td>
                            <td valign="top" id="Td1" class="msgerr">{Message}</td>
                            <td class="emsg_2_2">&nbsp;</td>
                        </tr>
                        <tr>
                            <td class="emsg_3_1">&nbsp;</td>
                            <td class="emsg_3_2">&nbsp;</td>
                            <td class="emsg_3_3">&nbsp;</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
        <!--/Message-->
   </td></tr>
</table>
    

<table width="370" border="0" cellpadding="0" cellspacing="1" onkeyup="PreSubmit(event)" class="tblRpt">  
  <tr>
    <td colspan="2" class="RptHeader bg_eb">{Header}</td>
  </tr>
  <tr class="bg_eb">
    <td >{OldPassword}</td>
    <td class="red l">
        <input name="OldPassword" type="password" id="OldPassword" size="20" style="width: 150px;"/>        
    </td>
  </tr>
  <tr class="bg_eb">
    <td >{NewPassword}</td>
    <td class="red l" title="{alertPasswordRequire}" id="td_pass">
        <input name="NewPassword" type="password" id="NewPassword" size="20" onkeyup="checkpass(this,'td_pass');" style="width: 150px;"/>
    </td>
  </tr>
  <tr class="bg_eb">
    <td>{ConfirmPassword}</td>
    <td class="red l" title="{alertPasswordRequire}" id="td_confirmpass">
        <input name="ConfirmPassword" type="password" id="ConfirmPassword" size="20" style="width: 150px;" onkeyup="checkpass(this,'td_confirmpass');" />        
    </td>
  </tr>
  <tr>
    <td class="bg_eb">&nbsp;</td>
    <td class="bg_eb red l">
        <input type="button" value="{btnSubmit}" onclick="ExcSubmit();" id="btnSubmit" class="btn" style="width:55px"/>&nbsp;
        <input type="reset" value="{btnReset}" onclick="ExcReset();" id="btnReset" class="btn" />        
  </tr>
</table>

</form>

</div>

<input id="alertInputOldPwd" name="alertInputOldPwd" type="hidden" value="{alertInputOldPwd}" />
<input id="alertPasswordEmpty" name="alertPasswordEmpty" type="hidden" value="{alertPasswordEmpty}" />
<input id="alertErrorConfirm" name="alertErrorConfirm" type="hidden" value="{alertErrorConfirm}" />
<input id="alertPasswordRequire" name="alertPasswordRequire" type="hidden" value="{alertPasswordRequire}" />
<input id="alertPasswordSucc" name="alertPasswordSucc" type="hidden" value="{alertPasswordSucc}" />
