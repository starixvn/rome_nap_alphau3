<div id="divContent">
    <input type="hidden" name="pageQuery" id="pageQuery" value="normal">
    <table cellspacing="1" cellpadding="0" width="750px" class="tblRpt" border="0">
        <tr class="RptHeader">
            <td>{No_Header}</td>
            <td>{MessageID_Header}</td>
            <td>{PostDate_Header}</td>
            <td>{Message_Header}</td>
        </tr>
        <!--MessageContent-->
        <tr bgcolor="{clor-class}" onmouseover="bgColor='{clor-over}'" onmouseout="bgColor='{clor-class}'">
            <td class="w_order_ms">{No}</td>
            <td class="c_ms">{MessageID}</td>
            <td class="bl_time_ms">{PostDate}</td>
            <td class="message_content">{Message}</td>
        </tr>
        <!--/MessageContent-->
    </table>
</div>
