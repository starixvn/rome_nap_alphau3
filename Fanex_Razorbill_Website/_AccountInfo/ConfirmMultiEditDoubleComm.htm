<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.dcommMultiEditPopupTitle}</title>
    <link href="../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="Resources/DoubleCommissionPopup.css" rel="stylesheet" type="text/css" />
</head>
<body>    
    <div class="optionWrap">
        <table cellpadding="0" cellspacing="0" border="0">
            <tr>
                <td>
                    <input type="radio" id="dcomAllow" checked="checked" name="DComm"/><label for="dcomAllow">{dcommMultiEditPopupAllowOption}</label>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="radio" id="dcomDisallow" name="DComm"/><label for="dcomDisallow">{dcommMultiEditPopupDisallowOption}</label>
                </td>
            </tr>
        </table>
    </div>
    <div class="btnLeft">
        <button id="btnDCommMultiEdit" class="btnMain" onclick="MultiUpdateDComm();">
            {static:Resources.Lang.submit}</button>
    </div>
</body>
<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script src="../../_Components/AGEWnd/AGEWnd.js" type="text/javascript"></script>
<script src="Resources/DoubleCommission.js" type="text/javascript"></script>
</html>
