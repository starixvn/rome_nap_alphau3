<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.edit} {TargetCustName}</title>
    <link href="../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../_AccountInfo/Resources/ResetPassword.css" rel="stylesheet" type="text/css" />
</head>
<body id="bdSearch">
    <div id="page_popup">
    <table width="350px" cellpadding="0" cellspacing="1" border="0">
        <tr>
            <td class="l">
                <div id="header_main">
                    {static:Resources.Lang.lblChangePassword} {TargetCustName}</div>
            </td>
        </tr>
        <tr>
            <td align="center">
                {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
            </td>
        </tr>
        <tr>
            <td align="center">
                <table width="100%" align="center" cellpadding="0" cellspacing="1" border="0" class="tblRpt">
                    <tr class="RptHeader">
                        <td colspan="2" align="center">
                            {static:Resources.Lang.lblChangePassword}
                        </td>
                    </tr>
                    <tr class="bg_eb2">
                        <td class="r" style="width: 160px;">
                            {static:Resources.Lang.password}:
                        </td>
                        <td id="td_pass" class="l">
                            <input type="password" id="password" name="pw" onkeyup="CheckPass(this,'spnNewPwdIcon');" />
                            <span id="spnNewPwdIcon">&nbsp;</span>
                        </td>
                    </tr>
                    <tr class="bg_eb2">
                        <td class="r" style="width: 160px;">
                            {static:Resources.Lang.lblConfirmPassword}:
                        </td>
                        <td id="td_confirmpass" class="l">
                            <input type="password" id="confirmPassword" name="cpw" onkeyup="CheckPass(this,'spnConfirmPwdIcon');" />
                            <span id="spnConfirmPwdIcon">&nbsp;</span>
                        </td>
                    </tr>
                    <tr class="bg_eb2 c">
                        <td colspan="2">
                            <input type="submit" id="btnSubmit" value="{static:Resources.Lang.submit}" onclick="ChangePassword();" class="btn" />
                            &nbsp;
                            <input type="button" id="btnCancel" value="{static:Resources.Lang.reset}" onclick="Reset();" class="btn" />
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>
            </td>
        </tr>
    </table>
</div>
    <script src="../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../_Components/AGEWnd/AGEWnd.js" type="text/javascript"></script>
    <script src="../_AccountInfo/Resources/ResetPassword.js" type="text/javascript"></script>
</body>
</html>
