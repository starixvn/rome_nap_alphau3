<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{title}</title>
    <link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="Resources/Charts.css" rel="stylesheet" type="text/css" />
</head>
<body>
<form id="frmmain" method="get" {actionForm}>
    <div id="page_main">
        <div id="header_main">
            {title}
        </div>
        <div style="width: 370px">
            {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
        </div>
        <div style="padding-top:5px;">
        <table border="0" cellpadding="0" cellspacing="0" style="min-width:80%;">
            <tr>
                <td colspan="2">
                    {SearchPanel}
                </td>
            </tr>
            <tr><td height="7px" colspan="2"></td></tr>
            <tr>
                <td valign="top" style="padding-top:3px; width:{width}">
                     <!--TableWinLoss-->
                    <table class="tblRpt {BoldRow}" width='{width}' border="0" cellpadding="0" cellspacing="1" id="tbl-rpt">
                        <tr class="RptHeader">
                            <td>
                                {static:Resources.Lang.date}
                            </td>
                            <td>
                                {titlewinloss}
                            </td>
                            <td>
                                {static:Resources.Lang.turnover}
                            </td>
                        </tr>
                        <!--Content-->
                        <tr style="height:24px" bgcolor="{ColorClass}" onmouseover="this.style.backgroundColor='{static:Fanex.Age.UI.Common.RowBgOver}'"
                            onmouseout="this.style.backgroundColor='{ColorClass}'">
                            <td>
                                &nbsp;{monthly}
                            </td>
                            <td class="altercol">
                                {winloss}
                            </td>
                             <td class="altercol">
                                {turnover}
                            </td>
                        </tr>
                        <!--/Content-->
                        <!--NoInfo-->
                            <tr class="no_info">
                                <td colspan="3">{msg}</td>
                            </tr>
                        <!--/NoInfo-->
                    </table>
                    <!--/TableWinLoss-->
                </td>
                <td valign="top">
                    <!--ChartImage-->   
                        <div style="padding-left:10px; text-align:left">
                            <img usemap="#ChartImageMap" src='{pathChart}' id="ChartImage" style="border-width:0px;" />
                            {ChartImageMap}
                            <div id="toolTipOnChart" style="z-index: 999; visibility: hidden; position: absolute"></div>
                        </div>
                    <!--/ChartImage-->
                </td>
            </tr>
        </table>
        </div>
    </div>
</form>
</body>
<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script src="Resources/Charts.js" type="text/javascript"></script>
</html>
