<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link href="../../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../../../_Components/SearchUserName_Control/SearchUserName_Control.css" rel="stylesheet" type="text/css" />
    <link href="../../../_Components/SearchUserName_Control/styles.css" rel="stylesheet" type="text/css" />
    <link href="../Resources/SearchAndCopy.css" rel="stylesheet" type="text/css" />
    <link href="../Super/Resources/Master.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <table cellpadding="0" cellspacing="0">
        <tr>
            <td>
                {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
            </td>
        </tr>
        <tr>
            <td>
            <!--Header-->
                {header}
            <!--/Header-->
            </td>
        </tr>
        <tr>
            <td>
            <!--MemberSetting-->
                <div class="memberSettingInfo">
                    {memberSettingInfo}
                </div> 
            <!--/MemberSetting--> 
            </td>
        </tr>
        <tr>
            <td>
                {load:Sunplus.Agent.UI._MemberInfo.SearchAndCopy.ActiveTab_Template ActiveTabHeader = new Sunplus.Agent.UI._MemberInfo.SearchAndCopy.ActiveTab_Template()}
            </td>
        </tr>
    </table>   
    <div class="buttonReView">
        <div class=" btnLeft">
            <input type="button" onclick="javascript:{back_function}" value="{static:Resources.Lang.lblBack}" class="btnMain" id="sbuttonReView" />
        </div>
    </div>
    <div class="buttonNext">
        <div class=" btnLeft">
            <input type="button" onclick="javascript:{next_function}" value="{static:Resources.Lang.next}" class="btnMain" id="sbuttonNext" />
        </div>
    </div>
    <script src="../../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../../../_Components/AGEWnd/AGEWnd.js" type="text/javascript"></script>
    <script src="../Resources/SearchAndCopy.js" type="text/javascript"></script>
    <script src="Resources/Agent.js" type="text/javascript"></script>
</body>
</html>
