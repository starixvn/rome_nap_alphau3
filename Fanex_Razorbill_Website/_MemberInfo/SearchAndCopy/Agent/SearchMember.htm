<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link href="../../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../Resources/SearchAndCopy.css" rel="stylesheet" type="text/css" />
    <link href="../../../_Components/SearchUserName_Control/SearchUserName_Control.css" rel="stylesheet" type="text/css" />
    <link href="../../../_Components/SearchUserName_Control/styles.css" rel="stylesheet" type="text/css" />
</head>
<body id="bdSearch">
     <div id="page_main">

        <div style="width: 60%">
            <!--Header-->
                {header}
            <!--/Header-->
            <!--Search-->
            <div id="search">
                <span class="text_username">
                {static:Resources.Lang.username}
                </span>
                <input type="text" class="text_italic" name="txtUserName" id="txtUserName"
                        value="{static:Resources.Lang.enterusername}" onkeypress="SearchAndCopy.onKeyPressUser(event);"
                        onclick="SearchAndCopy.onclickUser('{static:Resources.Lang.enterusername}')" onblur="SearchAndCopy.onblurUser('{static:Resources.Lang.enterusername}')" autocomplete="off"/>
                        <span id="MessageWarning"></span>
            </div> 
            <div class="null">
                &nbsp         
            </div> 
            <!--/Search-->
            <div class="warning">
                <ul>
                    <li>{static:Resources.Lang.InfoAllSetting}</li>
                    <li>{static:Resources.Lang.InfoClickPreview}</li>
                    <li>{static:Resources.Lang.InfoClickNext}</li>
                </ul>
            </div> 
            <table id="tblNext">
               
                <tr>
                    <td>
                        <div class="buttonReView">                          
                            <a href="javascript:;" onclick="{review_function}">
                                <span class="sbuttonReView"> {static:Resources.Lang.preview} </span>
                            </a>
                        </div>       
                        <div class="buttonNext">
                            <a href="javascript:;" onclick="{next_function}">
                                <span class="sbuttonNext"> {static:Resources.Lang.skip} </span>
                            </a>
                        </div>
                    </td>
                </tr>
            </table>       
        </div>
    </div>
    <div class="shadow" id="shadow" />
    <div class="output" id="output" />
    <script src="../../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../../../_Components/IBCWnd/IBCWnd.js" type="text/javascript"></script>
    <script src="../../../_Components/SearchUserName_Control/autocomplete.js" type="text/javascript"></script>
    <script src="../../../_Components/SearchUserName_Control/SearchUserName_Control.js" type="text/javascript"></script>
    <script src="../Resources/SearchAndCopy.js" type="text/javascript"></script>
</body>
</html>
