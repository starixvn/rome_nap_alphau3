<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.lblMemberCommission}</title>
    <link href="../../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../../../_Reports/Resources/Reports.css" rel="stylesheet" type="text/css" />
    <link href="../PositionTakingList/Resources/PositionTakingList.css" rel="stylesheet" type="text/css" />
    <link href="Resources/MemberCommission.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div id="page_main">
<div id="header_main">
    <div>{static:Resources.Lang.lblMemberCommission}</div>
</div>

<div id="tbl-container">
 <div id="boderRight">
    <table cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td>
                <table id="box_header" border="0" cellpadding="0" cellspacing="0" style="width:100%;padding-left:3px">
                    <tr>                            
                        <td width="400">
                            {CommonGroup}
                        </td>

                        <!--GroupAgent-->
                        <!--GroupMaster-->
                        <td width="110" class="r">{static:Resources.Lang.selectmaster}</td>
                        <td width="120" >
                            <select id="selmaster" name="selmaster" onchange="getData_MemberCommission_Agent();">{ComboMaster}</select>
                        </td>
                        <!--/GroupMaster-->
                        <td width="100" class="r">{static:Resources.Lang.selectagent}</td>
                        <td width="140" id="selagent" name="selagent" >
                            <select id="selAg" name="selAg" onchange="show_data_com();">{ComboAgent}</select>
                        </td>
                        <td></td>
                        <!--/GroupAgent-->
                        <td class="MemberCommissionInfo" title="{static:Resources.Lang.tooltipCommission}" onclick="ShowInfoCommission();"></td>
                        <td width="5"></td>
                    </tr>
                </table> 
            </td>
        </tr>
        <tr>
            <td>
                <table id="tblMain" border="1" cellpadding="2" cellspacing="0" style="width:100%;">         
                    <thead>
                        <tr class="RptHeader nowrap">
                            <td colspan="3">&nbsp;</td>
                            <!--GameKind-->
                                <td {GameKindColSpan}>{lblGameKind}</td>
                            <!--/GameKind-->
                            <td colspan="2">&nbsp;</td>
                        </tr>
                        <tr> 
                            <td class="RptHeader02">#</td>
                            <td class="RptHeader02">{static:Resources.Lang.username}</td>	
                            <!--AdditionalRow-->
                            <td class="RptHeader02">&nbsp;</td>
		                    <!--/AdditionalRow-->
                            <!--GameType-->
                                <td {GameTypeClass}>{lblGameType}</td>
                            <!--/GameType-->
                            <!--AdditionalRow-->
                            <td class="RptHeader02">&nbsp;</td>
		                    <!--/AdditionalRow-->
		                    <td class="RptHeader02">{static:Resources.Lang.username}</td>	
                        </tr>
                    </thead>
                     <tbody>
                     <!--NoRowInfo-->
                    <tr class="bg_white">
                        <td colspan="{NoInfoColspan}" class="c nobold">{NoInfo}</td>
                    </tr>
                    <!--/NoRowInfo-->
                    <!--Rows-->
                    <tr class="{BgRow}">
                        <!--NonRepeat-->
                        <td class="w-order" {RowSpan}>{No}</td>
                        <td {RowSpan} class="l">
	                        <a>{UserName}</a>
	                    </td>
	                    <!--/NonRepeat-->	        
	                    <!--Role-->
	                    <td class="firstCol">{Role}</td>
	                    <!--/Role-->	
                        <!--RowData-->
                        <td style="color:#424242" >{RowData}</td>
                        <!--/RowData-->
                        <!--Role-->
	                    <td class="firstCol">{Role}</td>
	                    <!--/Role-->
	                    <!--NonRepeat-->
                        <td {RowSpan} class="l">
	                        <a>{UserName}</a>
	                    </td>
	                    <!--/NonRepeat-->
                    </tr>
                    <!--/Rows-->
                    </tbody>
                </table>
            </td>
        </tr>
    </table>
</div>
</div>
</div>
    <script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
    <script src="../../_Components/AGEWnd/AGEWnd.js" type="text/javascript"></script>
    <script src="Resources/MemberCommission.js" type="text/javascript"></script>
    <script src="Resources/MemberCommissionCasino.js" type="text/javascript"></script>
</body>
</html>
