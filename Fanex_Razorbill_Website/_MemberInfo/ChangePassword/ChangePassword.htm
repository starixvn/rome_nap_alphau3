<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.password}</title>
    <link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div id="page_main" onkeydown="age.DoEnter(event, 'ChangePassword()')">
        <div id="header_main">
			{static:Resources.Lang.password}
			<!--SecurityCode-->
			&nbsp;|&nbsp;
			<a id="linkChangeSC" name="linkChangeSC" href="javascript:GotoSCPage()">{static:Resources.Lang.SecurityCode}</a>
			<!--/SecurityCode-->
        </div>
		<br />
        <div style="width: 370px">
            {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
        </div>
        <table width="370" border="0" cellpadding="0" cellspacing="1" class="tblRpt">
            <tr>
                <td colspan="2" class="RptHeader bg_eb">
                    {static:Resources.Lang.lblChangePassword}
                </td>
            </tr>
            <tr class="bg_eb">
                <td>
                    {static:Resources.Lang.lblOldPassword}
                </td>
                <td class="l">
                    <input id="txtOldPwd" type="password" name="txtOldPwd" />
                </td>
            </tr>
            <tr class="bg_eb">
                <td class="l" width="40%">
                    {static:Resources.Lang.password}
                </td>
                <td class="l">
                    <input id="txtNewPwd" onkeyup="return CheckPass(this,'spnNewPwdIcon');" type="password" name="txtNewPwd" />
                    <span id="spnNewPwdIcon">&nbsp;</span>
                </td>
            </tr>
            <tr class="bg_eb">
                <td class="l">
                    {static:Resources.Lang.lblConfirmPassword}
                </td>
                <td class="l">
                    <input id="txtConfirmPwd" onkeyup="return CheckPass(this,'spnConfirmPwdIcon');" type="password" name="txtConfirmPwd" />
                    <span id="spnConfirmPwdIcon">&nbsp;</span>
                </td>
            </tr>
            <tr>
                <td class="bg_eb c" colspan="2">
                    <input type="button" value="{static:Resources.Lang.submit}" onclick="ChangePassword();" class="btn" />&nbsp;
                    <input type="reset" value="{static:Resources.Lang.reset}" onclick="Reset();" class="btn" />
                </td>
            </tr>
        </table>
    </div>

</body>

<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script src="Resources/ChangePassword.js" type="text/javascript"></script>
</html>
