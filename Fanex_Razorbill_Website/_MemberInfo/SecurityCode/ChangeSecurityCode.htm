<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{title}</title>
	<link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
</head>
<body>
	<div id="page_main" onkeydown="age.DoEnter(event, 'ChangeSecCode()')">
        <div id="header_main">
			<!--Password-->
			<a id="linkChangePwd" name="linkChangePwd" href="javascript:GotoPwdPage()">{static:Resources.Lang.password}</a>
			&nbsp;|&nbsp;
			<!--/Password-->
			{static:Resources.Lang.SecurityCode}
		</div>
		<br />
        <div style="width: 370px">
            {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
        </div>
        <table width="370" border="0" cellpadding="0" cellspacing="1" class="tblRpt">
            <tr>
                <td colspan="2" class="RptHeader bg_eb">
                    {title}
                </td>
            </tr>
            <!--OldSecCode-->
            <tr class="bg_eb">
                <td class="l" width="40%">
                    {static:Resources.Lang.oldSecCode}
                </td>
                <td class="l">
                    <input id="inputSecCode" type="password" name="inputSecCode" autocomplete="off" />
                </td>
            </tr>
            <!--/OldSecCode-->
            <tr class="bg_eb">
                <td class="l" width="40%">
                    {static:Resources.Lang.SecurityCode}
                </td>
                <td class="l">
                    <input id="txtSecCode" onkeyup="return CheckSecCode(this,'spnSecCodeIcon');" type="password" name="txtSecCode" autocomplete="off" />
                    <span id="spnSecCodeIcon">&nbsp;</span>
                </td>
            </tr>
            <tr class="bg_eb">
                <td class="l">
                    {static:Resources.Lang.ConfirmSecurityCode}
                </td>
                <td class="l">
                    <input id="txtConfirmSecCode" onkeyup="return CheckSecCode(this,'spnConfirmSecCodeIcon');" type="password" name="txtConfirmSecCode" autocomplete="off" />
                    <span id="spnConfirmSecCodeIcon">&nbsp;</span>
                </td>
            </tr>
            <tr>
                <td class="bg_eb c" colspan="2">
                    <input type="button" value="{static:Resources.Lang.submit}" onclick="ChangeSecCode();"
                        class="btn" />&nbsp;
                    <input type="reset" value="{static:Resources.Lang.reset}" onclick="Reset();" class="btn" />
                </td>
            </tr>
        </table>
    </div>
</body>
<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script src="../../_GlobalResources/Js/Sha1.js" type="text/javascript"></script>
<script src="../../_GlobalResources/Js/Sha256.js" type="text/javascript"></script>
<script src="Resources/ChangeSecurityCode.js" type="text/javascript"></script>
</html>
