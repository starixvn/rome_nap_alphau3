<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.SecurityCode}</title>
	<link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../../_GlobalResources/Css/Popup.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="page_popup">
	{static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}

	<table align="left" width="100%" class="tblPop" cellspacing="1" cellpadding="0" border="0" onkeydown="age.DoEnter(event, 'SubmitSecCode()')">
		<tr class="bg_eb2">
			<td class="r b">{static:Resources.Lang.SecurityCode}</td>
			<td class="l">
				<input id="inputSecCode" type="password" name="inputSecCode" autocomplete="off" />
            </td>
		</tr>
		<tr class="bg_eb2" style="display:none;">
			<td class="b" colspan="2">
				<input id="chkNotAskAgain" type="checkbox" checked="checked" name="chkNotAskAgain" />
				<label id="lblNotAskAgain" name="lblNotAskAgain" style="cursor:pointer;" onclick="NotAskAgainClick();">{static:Resources.Lang.lblNotAskSecCodeAgain}</label>
			</td>
		</tr>
		<tr>
			<td class="bg_eb c" colspan="2">
				<input type="button" value="{static:Resources.Lang.submit}" onclick="SubmitSecCode();" class="btn" />&nbsp;
				<input type="reset" value="{static:Resources.Lang.reset}" onclick="Reset();" class="btn" />
			</td>
		</tr>
            <tr>
                <td class="bg_eb c" colspan="2">
                    {contactMessage}
                </td>
            </tr>
	</table>
</div>
</body>
<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>
<script src="../../_GlobalResources/Js/Sha1.js" type="text/javascript"></script>
<script src="../../_GlobalResources/Js/Sha256.js" type="text/javascript"></script>
<script src="Resources/CheckSecurityCode.js" type="text/javascript"></script>
</html>
