<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{static:Resources.Lang.voidandreject}</title>
    <link href="../../_GlobalResources/Css/Agent.css" rel="stylesheet" type="text/css" />
    <link href="../Resources/Reports.css" rel="stylesheet" type="text/css" />
    <link href="../../_BetList/Resources/BetList.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <form id="frmCancelBetList" method="get">
    <div class="bl_title">
        {static:Resources.Lang.voidandreject}
        <div class="divBoxRight">
            <input type="image" id="exporttoexcel" name="exporttoexcel" alt="{static:Resources.Lang.exporttoexcel}"
                nofocus="true" src="../../_GlobalResources/Images/excel.gif" title="{static:Resources.Lang.exporttoexcel}"
                class="hand" />
        </div>
    </div>
    <!--Options-->
    <div id="box_header" style="width: 100%">
        <table class="l" cellpadding="0" cellspacing="0" border="0">
            <tr>
                <!--Master-->
                <td>
                    {static:Resources.Lang.master}
                </td>
                <td width="10px;">
                </td>
                <td id="optmaster">
                    {option_master}
                </td>
                <td width="10px;">
                </td>
                <!--/Master-->
                <!--Agent-->
                <td id="optagent1">
                    {static:Resources.Lang.agent}
                </td>
                <td width="10px;" id="optagent2">
                </td>
                <td id="optagent">
                    {option-agent}
                </td>
                <td width="10px;">
                </td>
                <!--/Agent-->
                <!--Member-->
                <td id="optmember1">
                    {static:Resources.Lang.member}
                </td>
                <td width="10px;" id="optmember2">
                </td>
                <td id="optmember">
                    {option-member}
                </td>
                <td width="10px;">
                </td>
                <!--/Member-->
                <td>
                    <div id="loading" class="hidden">
                    </div>                    
                </td>
            </tr>
        </table>
    </div>
    <!--/Options-->
    <div id="content">
        {content}</div>
    </form>
</body>

<script src="../../_GlobalResources/Js/Core.js" type="text/javascript"></script>

<script src="../../_Components/AGEWnd/AGEWnd.js" type="text/javascript"></script>

<script src="../Resources/Reports.js" type="text/javascript"></script>

<script src="Resources/CancelBetList.js" type="text/javascript"></script>

</html>
