<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{Title}</title>
    <!--HiddenBlock-->
    <link href="../Core.css" rel="stylesheet" type="text/css" />
    <link href="../CustomerInfo.css" rel="stylesheet" type="text/css" />
    <!--/HiddenBlock-->
    <link href='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTEngine.UI.Core.css")}'
        rel="stylesheet" type="text/css" />
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTEngine.UI.Languages.en.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTEngine.UI.Core.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTEngine.UI.BetType.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTEngine.UI.BetTypeGroup.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTEngine.UI.BettingLimit.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTEngine.UI.knockout-2.0.0.js")}'
        type="text/javascript"></script>
    <script src='{dataSource}?targetCustId={targetCustId}&targetRoleId={targetRoleId}&formType={formType}'
        type="text/javascript"></script>
    <!--CssBlock-->
    <!--/CssBlock-->
</head>
<body>
    <form method="post">
    <div class="minWidthCustomer">
        {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
        <input type="hidden" name="txtCustomerObject" id="txtCustomerObject" />
        <div class="pt7">
            <div class="btnLeft">
                <button data-bind='click: saveCustomer' accountpermisssion="[B]" id="btnSubmit" class="btnMain">
                    {actionName}</button>
            </div>
        </div>
        <div class="commission">
            <div class="customerInfoBlock6">
                <span data-bind="text: customer.userNames"></span>
            </div>
            <div class="headerTab" id="statusHeader">
                {static:Resources.Lang.status}</div>
            <div class="clearBlock">
                <div class="customerInfoBlock7">
                    <label for="closed">
                        {static:Resources.Lang.closed}</label></div>
                <div class="customerInfoBlock5">
                    <input name="closed" id="closed" type="checkbox" data-bind="checked: customer.statusSetting.closed" /></div>
            </div>
        </div>
         {commisstionControl}
        <div class="clearBlock">
        </div>
        <br />
        <div class="headerBetSetting">
            {static:Resources.Lang.lblBetSetting}</div>
        <div id="bettingLimitContainer">
        </div>
        <br />
        <div class="clearBlock">
        </div>
        <div class="headerPositionTaking">
            {static:Resources.Lang.positiontaking}
            <div style="float:right;">
                <a class="infoIco" style="margin:3px 5px;height:16px;display:inline-block"
                    href="../../../PositionTakingInformation/PositionTakingBetTypeReference" target="_blank" title="{static:Resources.Lang.ClickToViewPTInfo}"></a>
            </div>
        </div>
        <div class="positionTaking">
            <div id="ptGridContainer">
            </div>
        </div>
        <div class="clearBlock">
        </div>
        <div class="pt7">
            <div class="btnLeft">
                <button data-bind='click: saveCustomer' accountpermisssion="[B]" id="btnSubmitFooter" class="btnMain">
                    {actionName}</button>
            </div>
        </div>
    </div>
    </form>
    <!--ScriptBlock-->
    <!--/ScriptBlock-->
</body>
</html>
